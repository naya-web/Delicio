<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Delicio</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header section  -->
    <header class="main-header">
      <h1>teeeeeeeeeeeeeeeeeeeeeest</h1>
      <div class="header-content">
        <span class="logo-text">Delicio</span>
        <div class="language-select">
          <div class="lang-box">
            <i class="fas fa-globe language-icon"></i>
            <span>English</span>
          </div>
          <i class="fas fa-chevron-down dropdown-icon"></i>
        </div>
      </div>
    </header>

    <!-- carousel section  -->
     <div class="container">
       <div class="carousel-container">
         <div class="carousel-slide">
           <div class="image-pair">
             <img src="./assets/images/slide1.jpg" alt="Image 1" />
             <img src="./assets/images/slide2.jfif" alt="Image 2" />
           </div>
           <div class="image-pair">
             <img src="./assets/images/slide3.jfif" alt="Image 3" />
             <img src="./assets/images/slide4.jfif" alt="Image 4" />
           </div>
         </div>
       </div>
     </div>

    <section>
      <div class="container">
        <div class="video-gallery">
          <div class="main-video">
            <video
              id="mainPlayer"
              src="./assets/videos/video1.mp4"
              controls
              autoplay
              muted
            ></video>
          </div>

          <div class="video-section-header">
            <h2>VIDEOS</h2>
            <button id="toggleListBtn">
              4 videos
              <i class="fa-solid fa-caret-down"></i>
            </button>
          </div>

          <div class="video-list hidden" id="videoList">
            <div
              class="video-item active"
              data-src="./assets/videos/video1.mp4"
            >
              <div class="info">
                <div class="thumbnail-container">
                  <img src="./assets/images/thumb1.png" alt="Video 1" />

                  <div class="play-overlay">
                    <i class="fas fa-play play-icon"></i>
                  </div>
                </div>
                <p>Good Day 1</p>
              </div>
              <span>0:41</span>
            </div>
            <div class="video-item" data-src="./assets/videos/video2.mp4">
              <div class="info">
                <div class="thumbnail-container">
                  <img src="./assets/images/thumb1.png" alt="Video 1" />

                  <div class="play-overlay">
                    <i class="fas fa-play play-icon"></i>
                  </div>
                </div>

                <p>Good Day 2</p>
              </div>
              <span>0:25</span>
            </div>

            <div class="video-item" data-src="./assets/videos/video3.mp4">
              <div class="info">
                <div class="thumbnail-container">
                  <img src="./assets/images/thumb1.png" alt="Video 1" />

                  <div class="play-overlay">
                    <i class="fas fa-play play-icon"></i>
                  </div>
                </div>
                <p>Good Day 3</p>
              </div>
              <span>0:17</span>
            </div>

            <div class="video-item" data-src="./assets/videos/video4.mp4">
              <div class="info">
                <div class="thumbnail-container">
                  <img src="./assets/images/thumb1.png" alt="Video 1" />

                  <div class="play-overlay">
                    <i class="fas fa-play play-icon"></i>
                  </div>
                </div>
                <p>Good Day 4</p>
              </div>
              <span>0:15</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer section  -->
    <footer class="mobile-footer">
      <div class="footer-icon">
        <a href="#"><i class="fa-solid fa-house-chimney"></i></a>
        <p>HOME</p>
      </div>

      <div class="footer-icon">
        <a href="#"><i class="fa-solid fa-book-open"></i></a>
        <p>MENU</p>
      </div>
      <div class="footer-icon">
        <a href="#"><i class="fa-solid fa-images"></i></a>
        <p>GALLERY</p>
      </div>
      <div class="footer-icon">
        <a href="#"><i class="fa-solid fa-star-half-stroke"></i></a>
        <p>RATE US</p>
      </div>
      <div class="footer-icon">
        <a href="#"><i class="fa-regular fa-address-book"></i></a>
        <p>CONTACT</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
